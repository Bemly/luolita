<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luolita Browser Demo</title>

  <!-- 1. Load compiler dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/coffeescript@2/dist/coffeescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pug@3/pug.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stylus@0/dist/stylus.min.js"></script>

  <!-- 2. Load Luolita browser compiler -->
  <script src="../luolita.browser.js"></script>

  <style>
    /* Initial loader style, will be replaced by compiled stylus */
    body { margin: 0; font-family: system-ui, sans-serif; }
    #app { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <!-- 3. Target element for rendered output -->
  <div id="app">
    <p>Loading Luolita...</p>
  </div>

  <!-- 4. .luoli source (inline for demo) -->
  <script type="text/plain" id="luoli-source">
coffee:
  appName = "Luolita"
  greeting = "你好，浏览器！"
  items = ["CoffeeScript", "Pug", "Stylus"]
  version = "0.1.4"
  console.log "#{ appName } v#{ version } running in browser!"
  console.log "Compiled #{ items.length } syntactic sugars"

template:
  .container
    h1= greeting
    .version v#{ version }
    .tech-tags
      each item in items
        span.tag= item
    .source-toggle
      button(id="toggle-src") Show Source
      pre(id="source-code", style="display:none")
        code= source

style:
  body
    margin: 0
    min-height: 100vh
    display: flex
    align-items: center
    justify-content: center
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif

  .container
    text-align: center
    padding: 2rem 3rem
    background: rgba(255, 255, 255, 0.95)
    border-radius: 16px
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3)
    max-width: 90vw

  h1
    margin: 0 0 0.5rem
    color: #333
    font-size: 2rem

  .version
    color: #888
    font-size: 0.9rem
    margin-bottom: 1.5rem

  .tech-tags
    display: flex
    gap: 0.5rem
    justify-content: center
    flex-wrap: wrap

    .tag
      display: inline-block
      padding: 0.4rem 1rem
      background: #667eea
      color: white
      border-radius: 20px
      font-size: 0.9rem

  .source-toggle
    margin-top: 1.5rem

    button
      padding: 0.5rem 1.2rem
      border: none
      background: #764ba2
      color: white
      border-radius: 8px
      cursor: pointer
      font-size: 0.85rem

    pre
      margin-top: 1rem
      text-align: left
      background: #1e1e2e
      color: #cdd6f4
      padding: 1rem
      border-radius: 8px
      overflow-x: auto
      font-size: 0.8rem
      line-height: 1.4

      code
        white-space: pre-wrap
  </script>

  <!-- 5. Compile and render -->
  <script>
    var sourceText = document.getElementById('luoli-source').textContent.trim()

    // Add the source variable for the template to display
    // We'll compile it with the source injected
    Luolita.renderToDOM(sourceText, '#app', {
      outputName: 'demo',
      debug: true
    }).then(function () {
      // Add source display toggle
      document.getElementById('toggle-src').addEventListener('click', function () {
        var pre = document.getElementById('source-code')
        var visible = pre.style.display !== 'none'
        pre.style.display = visible ? 'none' : 'block'
        if (!pre.textContent) {
          pre.querySelector('code').textContent = sourceText
        }
      })
      console.log('[demo] Render complete!')
    }).catch(function (err) {
      document.getElementById('app').innerHTML = '<p style="color:red; padding: 2rem;">Error: ' + err.message + '</p>'
      console.error('[demo] Error:', err)
    })
  </script>
</body>
</html>
