<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luolita</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0c; color: #e4e4e8; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
  <script src="luolita.browser.bundle.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    fetch('example.luoli')
      .then(function (res) { return res.text() })
      .then(function (text) {
        Luolita.renderToDOM(text, '#app', { outputName: 'example' })
      })
      .catch(function (err) {
        document.getElementById('app').textContent = 'Error: ' + err.message
      })
  </script>
</body>
</html>
